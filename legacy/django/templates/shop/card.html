{% load shop_tags %}<article class="product-card"><a class="product-visual{% if 'colecao-pdf/' in p.demo_image or 'catalogo-referencia/' in p.demo_image %} product-visual-contained{% endif %}" href="{{ p.get_absolute_url }}"><img src="{{ p.image_url }}" alt="{{ p.image_alt|default:p.title }}" loading="lazy" width="720" height="800">{% if p.conceptual %}<span class="product-tag">CONCEITO</span>{% endif %}<span class="card-arrow" aria-hidden="true">↗</span></a><div class="product-meta"><span>{{ p.category.name }}</span><span>GUERREIROS</span></div><a class="product-title" href="{{ p.get_absolute_url }}">{{ p.title }}</a><p class="product-subtitle">{{ p.subtitle }}</p><div class="product-price"><strong>{{ p.price|brl }}</strong>{% if p.compare_price %}<del>{{ p.compare_price|brl }}</del>{% endif %}<a href="{{ p.get_absolute_url }}" aria-label="Ver {{ p.title }}">+</a></div></article>
